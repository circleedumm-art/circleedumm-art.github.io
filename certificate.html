<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate verification · Circle Learning Centre</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.ico"></head><body><main class="wrap top"><section class="card" style="padding:28px;max-width:680px;margin:12vh auto"><img src="logo.png" alt="Circle Learning Centre" height="48"><h1 style="margin:20px 0 8px">Certificate verification</h1><p id="state" role="status">Checking certificate…</p><div id="details" hidden><p><b>Certificate number:</b> <span id="number"></span></p><p><b>Course:</b> <span id="course"></span></p><p><b>Issued:</b> <span id="date"></span></p><p>This certificate is valid and was issued by Circle Learning Centre.</p></div><p><a href="index.html">Return to Circle Learning Centre</a></p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>firebase.initializeApp(firebaseConfig);(async()=>{const id=new URLSearchParams(location.search).get("id");const state=document.getElementById("state");if(!id||!/^[A-Za-z0-9]{20,30}$/.test(id)){state.textContent="Certificate could not be verified.";return}try{const d=await firebase.firestore().collection("certificateVerifications").doc(id).get();if(!d.exists||d.data().valid!==true){state.textContent="Certificate could not be verified.";return}const x=d.data();document.getElementById("number").textContent=x.certificateNo||"";document.getElementById("course").textContent=x.classTitle||"";document.getElementById("date").textContent=x.issuedAt?.toDate?x.issuedAt.toDate().toLocaleDateString():"";document.getElementById("details").hidden=false;state.textContent="Valid certificate"}catch(e){state.textContent="Verification is temporarily unavailable. Please try again."}})();</script></body></html>
