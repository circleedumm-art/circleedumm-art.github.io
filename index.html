</head>
<body>

<header class="bar">
  <a class="brand" href="#top" aria-label="Circle Learning Centre">
    <img class="logo-img" src="logo.png" alt="" width="32" height="32" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo'}))"><span class="brand-name">Circle Learning Centre</span>
  </a>
  <nav class="tabs" aria-label="Main">
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#programs" data-i18n="nav_programs"></a>
    <a href="#schedule" data-i18n="nav_schedule"></a>
    <a href="#verify" data-i18n="nav_verify"></a>
    <a href="#enrol" data-i18n="nav_enrol"></a>
  </nav>
  <div class="controls">
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="my" aria-pressed="false">မြန်မာ</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
    <button class="icon-btn sound-toggle-head" id="soundToggleHead" type="button" aria-pressed="false" aria-label="Sound effects off">♪</button>
    <button class="btn small" id="loginBtn" data-i18n="login"></button>
  </div>
</header>

<main id="top">
  <section class="hero">
<div class="petals" aria-hidden="true"><i style="--l:8%;--d:0s"></i><i style="--l:24%;--d:3s"></i><i style="--l:46%;--d:6s"></i><i style="--l:63%;--d:2s"></i><i style="--l:80%;--d:8s"></i><i style="--l:92%;--d:5s"></i></div>
<div class="kanote" aria-hidden="true"><svg viewBox="0 0 300 420" role="presentation"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M255 386C150 350 122 286 178 228c42-44 106-49 78-108-15-33-51-32-67-5-15 26 3 49 24 44 17-4 18-23 7-30"/><path d="M235 354c-76-23-110-67-76-112 20-27 57-33 62-62M187 229c-34-27-74-23-90 7-14 25 2 54 28 50 19-3 23-25 10-35M145 279c-40 13-66 2-72-22-6-23 13-41 33-33"/><path d="M224 343c-15-43 2-71 31-78 26-6 47 11 40 31-5 15-23 18-31 7"/></g><g fill="currentColor"><path d="M180 115c-27-38-13-67 5-79 21 29 20 53-5 79Z"/><path d="M180 115c37-26 66-13 76 7-28 20-52 19-76-7Z"/><path d="M180 115c27 37 13 66-7 76-20-28-19-52 7-76Z"/><path d="M180 115c-37 27-66 13-76-7 28-20 52-19 76 7Z"/><circle cx="180" cy="115" r="8"/><path d="M93 235c-19-25-8-44 4-52 14 19 14 35-4 52ZM97 235c25-18 44-8 51 4-18 14-35 13-51-4ZM97 235c18 25 8 44-4 51-14-18-13-35 4-51Z"/><circle cx="97" cy="235" r="6"/></g></svg></div>
    <h1 data-i18n="hero_title"></h1>
    <p class="lead" data-i18n="hero_sub"></p>
    <div class="actions">
      <a class="btn" href="#enrol" data-i18n="cta_enrol"></a>
      <a class="btn ghost" href="#programs" data-i18n="cta_programs"></a>
    </div>
  </section>

  <section id="about" class="wrap">
    <h2 data-i18n="about_h"></h2>
    <p class="body" data-i18n="about_p"></p>
    <ul class="group facts">
      <li><span data-i18n="f1_k"></span><b data-i18n="f1_v"></b></li>
      <li><span data-i18n="f2_k"></span><b data-i18n="f2_v"></b></li>
      <li><span data-i18n="f3_k"></span><b data-i18n="f3_v"></b></li>
    </ul>
  </section>

  <section id="programs" class="wrap">
    <h2 data-i18n="prog_h"></h2>
    <ul class="group" id="programList"></ul>
  </section>

  <section id="schedule" class="wrap">
    <h2 data-i18n="sched_h"></h2>
    <p class="note" data-i18n="sched_note"></p>
    <ul class="group" id="scheduleList"></ul>
  </section>

  <section id="guide" class="wrap" hidden>
    <h2 data-i18n="guide_h"></h2>
    <p class="body" data-i18n="guide_p"></p>
    <ul class="group" id="guideList"></ul>
  </section>

  <section id="verify" class="wrap">
    <h2 data-i18n="verify_h"></h2><p class="body" data-i18n="verify_p"></p>
    <form action="certificate.html" method="get" class="group form">
      <label><span data-i18n="verify_code"></span><input name="code" required autocomplete="off" placeholder="CLC-YYYY-…"></label>
      <button class="btn" type="submit" data-i18n="verify_btn"></button>
    </form>
  </section>

  <section id="enrol" class="wrap">
    <h2 data-i18n="enrol_h"></h2>
    <p class="body" data-i18n="enrol_p"></p>
    <ul class="group" style="margin:16px 0"><li class="item"><div class="grow"><b data-i18n="alumni_h"></b><small data-i18n="alumni_p"></small></div><a class="btn small" href="student.html#classes" data-i18n="alumni_cta"></a></li></ul>
    <form id="enrolForm" class="group form" novalidate>
      <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <label><span data-i18n="f_name"></span><input name="name" required autocomplete="name"></label>
      <label><span data-i18n="f_contact"></span><input name="contact" type="email" inputmode="email" required autocomplete="email"></label>
      <label><span data-i18n="f_course"></span><select name="course" id="courseSelect"></select></label>
      <label><span data-i18n="f_schol"></span><select name="scholarship" id="scholSel"></select></label>
      <label class="essay" id="essayLbl" hidden><span data-i18n="f_essay"></span><textarea name="essay" id="essay" rows="8"></textarea></label>
      <label><span data-i18n="f_note"></span><textarea name="note" rows="3"></textarea></label>
    </form>
    <p class="note warn" id="scholNote" hidden data-i18n="schol_warn"></p>
    <p class="note" id="essayCount" hidden></p>
    <p class="note" data-i18n="f_email_note"></p>
    <p class="note" data-i18n="f_privacy"></p>
    <button class="btn wide" type="submit" form="enrolForm" data-i18n="f_submit"></button>
    <p class="ok" id="enrolOk" hidden data-i18n="f_ok"></p>
  </section>

  <section id="reviews" class="wrap">
    <h2 data-i18n="rev_h"></h2>
    <p class="body" data-i18n="rev_p"></p>
    <div class="qnav"><button type="button" id="qPrev" aria-label="Previous reviews">‹</button><button type="button" id="qNext" aria-label="Next reviews">›</button></div>
    <div class="quotes" id="quoteList" tabindex="0" role="region" aria-label="Reviews"></div>
  </section>
</main>

<footer class="wrap foot">
  <span>© <span id="yr"></span> Circle Learning Centre</span>
  <span class="links"><a href="#" id="fb">Facebook</a><a href="#" id="yt">YouTube</a><a href="#" id="tt">TikTok</a><a href="#" id="installLink" hidden>Install app</a><a href="#" id="logoutLink" hidden data-i18n="logout"></a></span>
</footer>

<!-- Login sheet -->
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="grab"></div>
    <h3 id="loginTitle" data-i18n="login"></h3>
    <div class="seg full" id="roleSeg" role="group">
      <button data-role="student" aria-pressed="true" data-i18n="r_student"></button>
      <button data-role="teacher" aria-pressed="false" data-i18n="r_teacher"></button>
      <button data-role="admin" aria-pressed="false" data-i18n="r_admin"></button>
    </div>
    <form id="loginForm" class="group form" novalidate>
      <label data-idrow><span data-i18n="l_id"></span><input name="id" autocomplete="username"></label>
      <label data-idrow><span data-i18n="l_pw"></span><input name="pw" type="password" autocomplete="current-password"></label>
    </form>
    <button class="btn wide" id="signIn" data-i18n="l_signin"></button>
    <button class="btn ghost wide" id="googleBtn" data-i18n="l_google" hidden></button>
    <p class="note center err" id="loginErr" hidden></p>
    <p class="note center" data-i18n="l_soon"></p>
    <button class="link" id="closeSheet" data-i18n="close"></button>
  </div>
</div>

<!-- Full review -->
<div class="scrim" id="revScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Review">
    <div class="grab"></div>
    <div id="revBody" class="rev-full"></div>
    <button class="link" data-close-rev data-i18n="close"></button>
  </div>
</div>

<aside class="install-bar" id="installBar" role="region" aria-label="Install app" hidden><div class="install-copy"><b id="installTitle"></b><small id="installHelp"></small></div><button class="btn small" id="installAction" type="button"></button><button class="icon-btn" id="installDismiss" type="button" aria-label="Dismiss">×</button></aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="defaults.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
<script src="festive.js" defer></script>
<script src="pwa.js" defer></script>
<script src="ripple.js" defer></script>
<script src="sound.js" defer></script>
</body>
</html>
