name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Undefined variables (would have caught the FV bug)
        run: npm run lint
      - name: HTML structure
        run: npm run html
      - name: Manifest JSON
        run: npm run json
      - name: English / Burmese keys match
        run: npm run i18n
        on:
  pull_request:
  workflow_dispatch:
